name: Consuman PROEVO a Google Sheets

on:
  workflow_dispatch:
  schedule:
    - cron: "0 11 * * *"    # 08:00 Argentina
    - cron: "30 16 * * *"   # 13:30 Argentina
    - cron: "0 22 * * *"    # 19:00 Argentina

concurrency:
  group: consuman-proevo-sync
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write

jobs:
  sincronizar-proevo:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Autenticar con Google Cloud
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: projects/417885139765/locations/global/workloadIdentityPools/github-actions/providers/github
          service_account: consuman-github@proevo-ia.iam.gserviceaccount.com
          create_credentials_file: true

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          python -m playwright install --with-deps chromium

      - name: Descargar órdenes PROEVO desde Consuman
        env:
          CONSUMAN_USUARIO: ${{ secrets.CONSUMAN_USUARIO_PROEVO }}
          CONSUMAN_PASSWORD: ${{ secrets.CONSUMAN_PASSWORD_PROEVO }}
          CONSUMAN_HEADLESS: "1"
          CONSUMAN_SKIP_EXCEL: "1"
        run: |
          python export_work_orders_proevo.py

      - name: Verificar versión del script PROEVO
        run: |
          echo "Commit ejecutado: $GITHUB_SHA"
          echo "Carpeta:"
          pwd
          echo "Archivo:"
          ls -l sync_google_sheets_proevo.py
          echo "Buscando setBasicFilter:"
          grep -n "setBasicFilter" sync_google_sheets_proevo.py || echo "OK - setBasicFilter NO existe"
          echo "Buscando frozenRowCount:"
          grep -n "frozenRowCount" sync_google_sheets_proevo.py || true

      - name: Verificar versión del script PROEVO
        run: |
          echo "Commit ejecutado: $GITHUB_SHA"
          echo "Carpeta:"
          pwd
          echo "Archivo:"
          ls -l sync_google_sheets_proevo.py
          echo "Buscando setBasicFilter:"
          grep -n "setBasicFilter" sync_google_sheets_proevo.py || echo "OK - setBasicFilter NO existe"
          echo "Buscando frozenRowCount:"
          grep -n "frozenRowCount" sync_google_sheets_proevo.py || true
     
      - name: Actualizar Google Sheets PROEVO
        env:
          GOOGLE_SHEET_ID: "1FuowVEsGZDKUjHedfOgPuMSSSFEmfr1itIgW-TMuQEM"
          GOOGLE_SHEET_TAB: "Órdenes de trabajo"
        run: |
          python sync_google_sheets_proevo.py
