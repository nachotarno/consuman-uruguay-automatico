name: Consuman Uruguay a Google Sheets

on:
  workflow_dispatch:

  schedule:
    - cron: "0,30 * * * *"

permissions:
  contents: read
  id-token: write

jobs:
  sincronizar:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Autenticar con Google Cloud
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: projects/417885139765/locations/global/workloadIdentityPools/github-actions/providers/github
          service_account: consuman-github@proevo-ia.iam.gserviceaccount.com

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          python -m playwright install --with-deps chromium

      - name: Descargar órdenes desde Consuman
        env:
          CONSUMAN_USUARIO: ${{ secrets.CONSUMAN_USUARIO }}
          CONSUMAN_PASSWORD: ${{ secrets.CONSUMAN_PASSWORD }}
          CONSUMAN_HEADLESS: "1"
        run: |
          python export_work_orders.py

      - name: Actualizar Google Sheets
        run: |
          python sync_google_sheets.py
